<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SINCOPA Results</title>
</head>

<body>

<h1>SINCOPA Results</h1>

<h3>Fixed phylogenetic tree</h3>

<pre id="treePreview"></pre>

<p>
    <a id="downloadTree">
        Download fixed tree
    </a>
</p>

<h3>Fixed MSA</h3>

<p id="msaInfo"></p>

<p>
    <a id="downloadMsa">
        Download fixed MSA
    </a>
</p>

<p>
    <a id="downloadHomoplasy">Download homoplasy.txt</a>
</p>
    
<p>
    <a id="downloadControl">Download control.txt</a>
</p>   
    
<p id="removedTaxa"></p>

<h3>SINCOPA scores</h3>

<pre id="sweepsScoresPreview"></pre>
    
<p>
    <a href="index.html">Run another analysis</a>
</p>
    
<script>

/* tree vars */
const fixedTree =
    sessionStorage.getItem("fixedTree");

const originalTreeName =
    sessionStorage.getItem("treeFileName");

const removedTaxa =
    JSON.parse(
        sessionStorage.getItem("taxaToRemove") || "[]"
    );

/* msa vars */
const fixedMsa =
    sessionStorage.getItem("fixedMsa");

const originalMsaName =
    sessionStorage.getItem("msaFileName");

const msaOriginalLength =
    sessionStorage.getItem("msaOriginalLength");

const msaTrimmedLength =
    sessionStorage.getItem("msaTrimmedLength");

const homoplasyText =
    sessionStorage.getItem("homoplasyText");

const controlText =
    sessionStorage.getItem("controlText");
    
if (!fixedTree) {

    document.getElementById("treePreview")
        .textContent = "No result available.";

}
else {

    document.getElementById("treePreview")
        .textContent = fixedTree;

    let outputName = "tree_fixed.newick";

    if (originalTreeName) {

        const dot =
            originalTreeName.lastIndexOf(".");

        if (dot !== -1) {

            outputName =
                originalTreeName.substring(0, dot) +
                "_fixed" +
                originalTreeName.substring(dot);

        }
        else {

            outputName =
                originalTreeName + "_fixed.newick";
        }
    }


    const blob =
        new Blob(
            [fixedTree],
            { type: "text/plain" }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.getElementById("downloadTree");

    link.href = url;
    link.download = outputName;
}

if (fixedMsa) {

    let msaOutputName = "msa_fixed.fasta";

    if (originalMsaName) {

        const dot =
            originalMsaName.lastIndexOf(".");

        if (dot !== -1) {

            msaOutputName =
                originalMsaName.substring(0, dot) +
                "_fixed" +
                originalMsaName.substring(dot);

        }
        else {

            msaOutputName =
                originalMsaName + "_fixed.fasta";
        }
    }


    const msaBlob =
        new Blob(
            [fixedMsa],
            { type: "text/plain" }
        );

    const msaUrl =
        URL.createObjectURL(msaBlob);

    const msaLink =
        document.getElementById("downloadMsa");

    msaLink.href = msaUrl;
    msaLink.download = msaOutputName;


    document.getElementById("msaInfo")
        .textContent =
            "MSA length: " +
            msaOriginalLength +
            " bp → " +
            msaTrimmedLength +
            " bp after trimming.";
}
else {

    document.getElementById("msaInfo")
        .textContent =
            "No fixed MSA available.";

    document.getElementById("downloadMsa")
        .style.display = "none";
}

if (removedTaxa.length) {

    document.getElementById("removedTaxa")
        .textContent =
            "Removed taxa: " +
            removedTaxa.join(", ");

}
else {

    document.getElementById("removedTaxa")
        .textContent =
            "No taxa were removed.";
}

/*
 * ---------------------------------------------------------
 * homoplasy.txt
 * ---------------------------------------------------------
 */
if (homoplasyText) {

    const homoplasyBlob =
        new Blob(
            [homoplasyText],
            { type: "text/plain" }
        );

    const homoplasyUrl =
        URL.createObjectURL(
            homoplasyBlob
        );

    const homoplasyLink =
        document.getElementById(
            "downloadHomoplasy"
        );

    homoplasyLink.href =
        homoplasyUrl;

    homoplasyLink.download =
        "homoplasy.txt";
}
else {

    document.getElementById("downloadHomoplasy")
        .style.display =
            "none";
}


/*
 * ---------------------------------------------------------
 * control.txt
 * ---------------------------------------------------------
 */
if (controlText) {

    const controlBlob =
        new Blob(
            [controlText],
            { type: "text/plain" }
        );

    const controlUrl =
        URL.createObjectURL(
            controlBlob
        );

    const controlLink =
        document.getElementById(
            "downloadControl"
        );

    controlLink.href =
        controlUrl;

    controlLink.download =
        "control.txt";
}
else {

    document.getElementById("downloadControl")
        .style.display =
            "none";
}

/*
 * ---------------------------------------------------------
 * sweep score
 * ---------------------------------------------------------
 */
    
const sweepsScoresText =
    sessionStorage.getItem("sweepsScoresText");

if (sweepsScoresText) {
    document.getElementById("sweepsScoresPreview").textContent =
        sweepsScoresText;
}
else {
    document.getElementById("sweepsScoresPreview").textContent =
        "No SINCOPA scores available.";
}
    
</script>

</body>
</html>
