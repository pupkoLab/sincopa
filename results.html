         <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
      const fixedMsa =
          sessionStorage.getItem("fixedMsa");
      
      const fixedTree =
          sessionStorage.getItem("fixedTree");
      
      const homoplasyText =
          sessionStorage.getItem("homoplasyText");
      
      const sweepsScoresText =
          sessionStorage.getItem("sweepsScoresText");
      
      const sweepsSummaryText =
          sessionStorage.getItem("sweepsSummaryText");
      
      const sweepsPlot =
          sessionStorage.getItem("sweepsPlot");
      
      const msaFileName =
          sessionStorage.getItem("msaFileName");
      
      const treeFileName =
          sessionStorage.getItem("treeFileName");
      
      
      // --------------------------------------------------
      // Running parameters
      // --------------------------------------------------
      
      document.getElementById("msaName").textContent =
          msaFileName || "raw text";
      
      document.getElementById("treeName").textContent =
          treeFileName || "raw text";
      
      
      // Job title, if we later store one
      const jobTitle =
          sessionStorage.getItem("jobTitle");
      
      if (jobTitle) {
          document.getElementById("jobTitle").textContent =
              jobTitle;
      
          document.getElementById("jobTitleRow").style.display =
              "block";
      }
      
      
      // --------------------------------------------------
      // Plot
      // --------------------------------------------------
      
      if (sweepsPlot) {
          document.getElementById("sweeps_scores").src =
              sweepsPlot;
      } else {
          document.getElementById("sweeps_scores").style.display =
              "none";
      }
      
      
      // --------------------------------------------------
      // ZIP
      // --------------------------------------------------
      
      document.getElementById("downloadAllResults").addEventListener(
          "click",
          async function(event) {
      
              event.preventDefault();
      
              const zip = new JSZip();
      
              if (fixedMsa) {
                  zip.file(
                      "msa_fixed.fasta",
                      fixedMsa
                  );
              }
      
              if (fixedTree) {
                  zip.file(
                      "tree_fixed.newick",
                      fixedTree
                  );
              }
      
              if (homoplasyText) {
                  zip.file(
                      "homoplasy.txt",
                      homoplasyText
                  );
              }
      
              if (sweepsScoresText) {
                  zip.file(
                      "sweeps_scores.txt",
                      sweepsScoresText
                  );
              }
      
              if (sweepsSummaryText) {
                  zip.file(
                      "sweeps_summary.txt",
                      sweepsSummaryText
                  );
              }
      
              if (sweepsPlot) {
      
                  const base64 =
                      sweepsPlot.split(",")[1];
      
                  zip.file(
                      "sweeps_scores.png",
                      base64,
                      { base64: true }
                  );
              }
      
              const zipBlob =
                  await zip.generateAsync({
                      type: "blob"
                  });
      
              const url =
                  URL.createObjectURL(zipBlob);
      
              const link =
                  document.createElement("a");
      
              link.href = url;
              link.download = "sincopa_results.zip";
      
              document.body.appendChild(link);
              link.click();
              link.remove();
      
              URL.revokeObjectURL(url);
          }
      );
    </script>
